<title>Hollow Dome</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(120% 80% at 50% 60%, rgba(165, 216, 230, 0.05), rgba(0, 0, 0, 0) 65%),
      #000;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    outline: none;
  }
</style>

<div class="stage">
  <canvas id="game" tabindex="0" autofocus aria-label="Hollow Dome"></canvas>
</div>

<script>/*__BUNDLE__*/</script>
<script>
  (function () {
    // the Artifact host supplies this; a standalone copy of the file does not,
    // and without it a phone lays the page out at 980px and the game renders oversized
    if (!document.querySelector('meta[name="viewport"]')) {
      var m = document.createElement('meta');
      m.name = 'viewport';
      m.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
      document.head.appendChild(m);
    }
    var c = document.getElementById('game');
    if (c) c.focus();
    // keep the keyboard pointed at the game on desktop, and swallow stray gestures on mobile
    window.addEventListener('pointerdown', function () { if (c) c.focus(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  })();
</script>
